[project]
name = "dsh-comfyui-gateway"
version = "0.6.0"
description = "MCP + REST gateway in front of a local ComfyUI (Qwen-Image 2.1), authenticated by Cloudflare Access"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pillow>=10.4",
  "pyjwt[crypto]>=2.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
